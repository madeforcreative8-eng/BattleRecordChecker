/* Searchable individual selection, compact match rows and directional outcomes. */

/* Shared selectors retain the photo and name instead of exposing long native options. */
.individual-select {
  display:flex; align-items:center; gap:10px; width:100%; min-width:0;
  min-height:54px; padding:9px 11px; border:1px solid #dce5d4;
  border-radius:9px; background:#fff; color:var(--ink); text-align:left;
}
.individual-select:hover:not(:disabled) { background:#f6faf0; border-color:#a7bd93; }
.individual-select>.avatar { width:34px; height:34px; border-radius:8px; }
.individual-select>.icon { margin-left:auto; width:16px; height:16px; color:#7d9270; }
.individual-select-copy { display:block; flex:1; min-width:0; line-height:1.4; }
.individual-select-copy strong { display:block; font-size:.875rem; font-weight:650; overflow-wrap:anywhere; }
.individual-select-copy small { display:block; margin-top:3px; font-size:.75rem; color:#74816b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.individual-select.compact { min-height:43px; padding:6px 9px; gap:8px; }
.individual-select.compact>.avatar { width:28px; height:28px; border-radius:7px; }
.individual-select.compact .individual-select-copy strong { font-size:.875rem; }
.individual-select.compact .individual-select-copy small { font-size:.75rem; margin-top:1px; }
.filters>.individual-select { flex:1 1 180px; width:auto; max-width:300px; }
.pair-contender>.individual-select { flex:1; min-width:0; }
.matrix-controls>.individual-select { max-width:300px; }

/* Compact form contenders. Hidden ID controls remain the integration contract. */
.contender-trigger {
  display:block; width:100%; min-width:0; border:0; padding:0;
  border-radius:8px; background:transparent; color:inherit; text-align:left;
}
.contender-trigger:hover { background:#eff5e8; }
.loser .contender-trigger:hover { background:#faf0e8; }
.contender-choice { display:flex; align-items:center; gap:9px; min-width:0; min-height:64px; }
.contender-choice>.avatar { width:45px; height:45px; border-radius:9px; }
.contender-choice-copy { display:block; flex:1; min-width:0; line-height:1.4; }
.contender-choice-copy strong { display:block; font-size:.875rem; font-weight:700; color:#354e2c; overflow-wrap:anywhere; }
.contender-choice-copy>span { display:block; margin-top:3px; font-size:.75rem; color:#798b6d; overflow-wrap:anywhere; }
.contender-choice-copy small { display:block; margin-top:3px; font-size:.75rem; color:#71885f; }
.contender-choice-action {
  display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px;
  padding:7px 9px; min-height:34px; border:1px solid #dbe5d0; border-radius:7px;
  color:#5d7a46; background:#fff; font-size:.8125rem; font-weight:650;
}
.loser .contender-choice-action { border-color:#e9dcd2; color:#9d6c54; }
.contender-choice-action .icon { width:15px; height:15px; }

/* Picker echoes the original database's green cards and prominent name plates. */
#individual-picker.individual-picker {
  width:860px; max-width:calc(100vw - 28px); max-height:calc(100dvh - 36px);
  padding:0; overflow:hidden; border:1px solid #45634d; border-radius:18px;
  background:#14271e; color:#e8f1e2; color-scheme:dark;
  box-shadow:0 24px 100px #10271966;
}
#individual-picker[open] { display:flex; flex-direction:column; }
#individual-picker::backdrop { background:#0c1d15b3; backdrop-filter:blur(3px); }
.picker-header {
  display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  flex-shrink:0; padding:20px 22px 16px; background:#193427; border-bottom:1px solid #37503c;
}
.picker-header>div { min-width:0; }
.picker-header h2 { margin:0; color:#edf5e8; font-size:1.18rem; line-height:1.5; letter-spacing:-.02em; }
.picker-header p { margin-top:4px; color:#a8bea0; font-size:.8125rem; line-height:1.7; }
.picker-header .icon-button,.picker-header>.btn { flex-shrink:0; color:#d7e8c9; border-color:#496248; }
.picker-header .icon-button:hover { background:#34513a; }
.picker-header>.btn { background:#294734; }
.picker-tools {
  position:sticky; top:0; z-index:2; flex-shrink:0; padding:15px 22px 10px;
  background:#14271e;
}
.picker-search { width:100%; margin-bottom:9px; }
.picker-search>.icon { color:#a0b696; }
.picker-tools .control {
  min-width:0; width:100%; min-height:43px; border-color:#476145; border-radius:8px;
  background-color:#203b2a; color:#e9f3df; font-size:1rem;
}
.picker-tools .control::placeholder { color:#a7bca0; }
.picker-tools .control:focus-visible { outline:2px solid #bee990; outline-offset:1px; }
.picker-tools select.control { background-position:right 9px center; padding:9px 28px 9px 10px; }
.picker-tools option,.picker-tools optgroup { color:#e9f3df; background:#203b2a; }
.picker-filter-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
.picker-result-meta {
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0;
  min-height:31px; padding:0 22px 10px; color:#abc29f; font-size:.8125rem;
}
.picker-result-meta .btn,.picker-result-meta button { color:#cbe8b3; font-size:.8125rem; }
.picker-result-meta .btn:hover { color:#e3f3d7; background:#2c4731; }
.picker-results {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start; gap:10px;
  grid-auto-rows:max-content;
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:2px 22px 18px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:#56754f #14271e;
}
.picker-card {
  display:flex; align-items:center; gap:11px; width:100%; min-width:0; min-height:98px;
  padding:12px; border:1px solid #3d5740; border-radius:11px;
  background:#1b3225; color:#e5efdf; text-align:left;
  box-shadow:0 3px 10px #0a1b1112; transition:background .15s,border-color .15s;
}
.picker-card:hover:not(:disabled) { background:#28462e; border-color:#9dc27c; }
.picker-card:focus-visible { outline:3px solid #c7ed9a; outline-offset:2px; }
.picker-card.selected { border-color:#c5e995; box-shadow:inset 0 0 0 1px #c5e995; background:#2b462c; }
.picker-card:disabled { opacity:.5; cursor:not-allowed; background:#1b2d23; }
.picker-card>.avatar { width:60px; height:60px; border-radius:9px; background:#314a34; color:#a0ba8b; }
.picker-card>.avatar img { width:100%; height:100%; object-fit:cover; }
.picker-card-main { display:block; flex:1; min-width:0; }
.picker-card-name {
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  width:fit-content; max-width:100%; padding:3px 6px; border-radius:5px;
  background:#eff3e9; color:#1e3524; font-size:1rem; font-weight:750;
  line-height:1.4; letter-spacing:-.02em; overflow-wrap:anywhere;
}
.picker-card-species { display:block; margin-top:5px; color:#c2d3b8; font-size:.75rem; line-height:1.45; overflow-wrap:anywhere; }
.picker-card-measures { display:block; margin-top:5px; color:#deebd1; font-size:.875rem; line-height:1.4; font-variant-numeric:tabular-nums; }
.picker-card-side { display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:6px; flex-shrink:0; max-width:76px; font-size:.75rem; color:#cdddab; }
.picker-card-side .badge { background:#314b2f; color:#c9e5ad; border:1px solid #506d42; font-size:.75rem; padding:2px 6px; }
.picker-card-side .badge.rest { background:#243d4a; color:#bdd9ed; border-color:#456879; }
.picker-card-side .badge.neutral { background:#3d4132; color:#d5d8bc; border-color:#606449; }
.picker-card-side strong { font-weight:750; color:#ead18a; }
.picker-note { display:block; margin-top:4px; color:#c9e6ae; font-size:.75rem; line-height:1.4; }
.picker-card:disabled .picker-note { color:#ddd1b2; }
.picker-card.selected .picker-note { color:#d6f7b6; font-weight:650; }
.picker-empty { grid-column:1/-1; padding:34px 15px; text-align:center; color:#b6cbaa; font-size:.875rem; line-height:1.9; }

.external-form-hint { margin-top:14px; color:#bbd0af; font-size:.8125rem; line-height:1.75; overflow-wrap:anywhere; }
#external-record-error { color:#ffd1c4; line-height:1.65; overflow-wrap:anywhere; }
#external-record-error:not(:empty) { margin-top:14px; padding:10px 12px; border:1px solid #9a5c49; border-radius:8px; background:#452e27; }
.external-record-form>.picker-footer { flex:0 0 auto; }
.external-record-form .picker-footer .btn { min-height:42px; }
.external-record-form .picker-footer .btn.primary { border-color:#c5e995; background:#c5e995; color:#233a20; }
.external-record-form .picker-footer .btn.primary:hover:not(:disabled) { border-color:#d4f0b1; background:#d4f0b1; }
.external-record-form button:disabled { opacity:.55; cursor:wait; }

@media (max-width:760px) {
  .avatar.external-avatar.xlarge>.external-avatar-label { -webkit-line-clamp:3; }
  .external-form-body { padding:16px 14px; }
  .external-fields { grid-template-columns:minmax(0,1fr); gap:14px; }
  .external-form-preview { gap:10px; margin-bottom:16px; padding:11px 12px; }
  .external-record-form .picker-footer { gap:8px; }
  .external-record-form .picker-footer .btn { font-size:.875rem; }
}
@media (max-width:370px) {
  .picker-card>.avatar.external-avatar>.external-avatar-label { font-size:9px; }
}

/* A single subject's matchups stay within the screen in a three-column table. */
.pair-panel .pair-contender>.field { width:100%; min-width:0; }
.matchup-panel { min-width:0; }
.matchup-controls {
  display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  align-items:end; gap:16px; padding:0 24px 17px; min-width:0;
}
.matchup-subject { min-width:0; }
.matchup-subject .individual-select { width:100%; max-width:none; min-height:48px; }
.matchup-filters { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; min-width:0; }
.matchup-sort-field { grid-column:1/-1; }
.matchup-controls .field { min-width:0; }
.matchup-controls .field>label,.matchup-controls .field>.field-label { color:#667b54; font-size:.875rem; line-height:1.5; }
.matchup-controls .control { width:100%; min-width:0; max-width:100%; min-height:48px; font-size:16px; }
.matchup-summary {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  grid-column:1/-1; gap:8px 14px; padding:11px 24px;
  border-top:1px solid #e5ebdc; background:#f6f9f1;
  color:#6a7e58; font-size:.8125rem; line-height:1.6;
}
.matchup-summary>:first-child { min-width:0; overflow-wrap:anywhere; }
.matchup-summary .btn { flex-shrink:0; }
.matchup-controls>.matchup-summary { padding:0; border:0; background:transparent; }
.matchup-panel>.empty-breakdown { margin:0 24px 20px; }
.matchup-panel>.matrix-legend { flex-wrap:wrap; gap:8px 14px; }
.matchup-panel>.matrix-legend>span { white-space:nowrap; }
.matchup-table-wrap { width:100%; max-width:100%; min-width:0; overflow:hidden; border-top:1px solid #e1e8d8; }
.matchup-table { width:100%; table-layout:fixed; border-collapse:collapse; border-spacing:0; }
.matchup-col-opponent { width:50%; }
.matchup-col-result { width:20%; }
.matchup-col-detail { width:30%; }
.matchup-table th,.matchup-table td {
  min-width:0; padding:12px 14px; border-bottom:1px solid #e7ecdf;
  text-align:left; vertical-align:middle; white-space:normal; overflow-wrap:anywhere;
}
.matchup-table th:first-child { padding-left:24px; }
.matchup-table th:last-child,.matchup-table td:last-child { padding-right:24px; }
.matchup-table thead th { background:#f7faf3; color:#74836a; font-size:.75rem; line-height:1.5; font-weight:650; }
.matchup-table thead th:not(:first-child) { text-align:center; }
.matchup-table tbody th { font-weight:400; }
.matchup-table tbody tr:last-child>th,.matchup-table tbody tr:last-child>td { border-bottom:0; }
.matchup-table tbody tr.positive>td:nth-child(2) { background:#afd68b; }
.matchup-table tbody tr.negative>td:nth-child(2) { background:#e78c7c; }
.matchup-table tbody tr.winning>td:nth-child(2) { background:#d7eac5; }
.matchup-table tbody tr.losing>td:nth-child(2) { background:#f6d4c9; }
.matchup-table tbody tr.tied>td:nth-child(2) { background:#a6c7ee; }
.matchup-table tbody tr.unplayed>td:nth-child(2) { background:#f7f8f4; }
.matchup-opponent {
  display:flex; align-items:center; gap:10px; width:100%; min-width:0; min-height:48px;
  padding:0; border:0; border-radius:6px; background:transparent; color:var(--ink);
  font:inherit; text-align:left; white-space:normal; cursor:pointer;
}
.matchup-opponent:hover .matchup-opponent-copy>strong { color:#557936; }
.matchup-opponent:focus-visible { outline:2px solid #789b58; outline-offset:3px; }
.matchup-opponent>.avatar { width:36px; height:36px; border-radius:8px; flex-shrink:0; }
.matchup-opponent-copy { display:block; flex:1; min-width:0; }
.matchup-opponent-copy>strong { display:block; font-size:.875rem; line-height:1.45; font-weight:650; overflow-wrap:anywhere; }
.matchup-opponent-copy>small {
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  margin-top:3px; overflow:hidden; color:#74816b; font-size:.75rem;
  line-height:1.45; font-weight:400; overflow-wrap:anywhere;
}
.matchup-opponent-copy>.badge { max-width:100%; margin-top:5px; padding:2px 6px; font-size:.75rem; line-height:1.5; white-space:normal; }
.matchup-result { min-width:0; color:#657552; font-size:.8125rem; line-height:1.5; text-align:center; overflow-wrap:anywhere; }
.matchup-score { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:3px 9px; min-width:0; }
.matchup-score>b { min-width:0; font-size:.875rem; line-height:1.4; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.matchup-result>small { display:block; margin-top:5px; color:#74816b; font-size:.75rem; line-height:1.5; font-variant-numeric:tabular-nums; white-space:normal; overflow-wrap:anywhere; }
.matchup-detail { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; color:#77876a; font-size:.75rem; line-height:1.5; text-align:center; overflow-wrap:anywhere; }
.matchup-methods { display:grid; width:100%; min-width:0; gap:7px; }
.matchup-method { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; }
.matchup-method-label { font-size:.6875rem; font-weight:650; line-height:1.35; }
.matchup-detail .method-pill {
  display:inline-block; width:fit-content; min-width:0; max-width:100%; padding:4px 5px;
  font-size:.75rem; line-height:1.45; white-space:normal; overflow-wrap:anywhere; text-align:left;
}
.matchup-detail .method-pill>.icon { display:inline-block; width:12px; height:12px; margin-right:3px; vertical-align:-2px; }
.matchup-detail>.btn { min-width:0; min-height:36px; max-width:100%; padding:5px 8px; font-size:.75rem; white-space:normal; }

@media (max-width:760px) {
  .matchup-controls { grid-template-columns:minmax(0,1fr); gap:13px; padding:0 14px 14px; }
  .matchup-filters { gap:8px; }
  .matchup-summary { padding:10px 14px; }
  .matchup-panel>.empty-breakdown { margin:0 14px 16px; }
  .matchup-table th,.matchup-table td { padding:10px 6px; }
  .matchup-table th:first-child { padding-left:12px; }
  .matchup-table th:last-child,.matchup-table td:last-child { padding-right:12px; }
  .matchup-opponent { align-items:flex-start; gap:6px; }
  .matchup-opponent>.avatar { margin-top:2px; }
  .matchup-score { flex-direction:column; gap:2px; }
  .matchup-result>small { margin-top:4px; }
}

/* Roster controls: full-width search, combined filters, shared sorting and clear results. */
.collection-tools.roster-tools {
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  align-items:end; gap:14px 16px; min-width:0; margin-bottom:20px;
}
.roster-tools>.roster-search-field { grid-column:1/-1; }
.roster-tools .field,.roster-tools .search-field { min-width:0; }
.roster-tools .search-field { width:100%; max-width:none; flex:none; }
.roster-tools .field>label { color:#667b54; font-size:.875rem; line-height:1.5; }
.roster-tools .control {
  width:100%; min-width:0; max-width:100%; min-height:48px;
  font-size:16px; line-height:1.5;
}
.roster-tools .search-field>.icon { top:15px; }
.roster-filter-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; min-width:0; }
.roster-search-hint { color:#74816b; font-size:.8125rem; line-height:1.7; overflow-wrap:anywhere; }
.roster-result-meta {
  grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:8px 14px; min-width:0; min-height:36px;
}
.roster-tools .collection-count { margin:0; color:#667b54; font-size:.875rem; line-height:1.6; font-variant-numeric:tabular-nums; }
.roster-result-meta .btn { min-height:40px; white-space:normal; }
.roster-empty { padding:32px 24px; text-align:center; }
.roster-empty h2 { color:#4b6242; font-size:1rem; line-height:1.6; }
.roster-empty p { max-width:480px; margin:10px auto 0; color:#74816b; font-size:.875rem; line-height:1.8; }
.roster-empty .btn { margin-top:18px; white-space:normal; }
@media (max-width:760px) {
  .collection-tools.roster-tools { grid-template-columns:minmax(0,1fr); gap:13px; }
  .roster-filter-row { gap:8px; }
  .roster-sort-field { grid-column:1/-1; }
  .roster-empty { padding:26px 16px; }
}
/* End roster controls. */

/* Three clear backup actions and the rules shown before importing. */
.menu-panel.backup-menu { width:min(380px,calc(100vw - 28px)); max-height:calc(100dvh - 100px); overflow-y:auto; }
.backup-menu>button { align-items:flex-start; min-height:56px; padding:13px 12px; font-size:.875rem; line-height:1.6; white-space:normal; }
.backup-menu>button>.icon { flex-shrink:0; margin-top:3px; }
.backup-menu>button>span { min-width:0; overflow-wrap:anywhere; }
.backup-menu small { margin-top:4px; line-height:1.6; }
.import-explanation p { margin-top:6px; }
.import-rules { margin-top:14px; padding:14px 16px; border:1px solid var(--line); border-radius:10px; }
.import-rules>summary { color:#627f4a; font-size:.875rem; font-weight:650; line-height:1.6; cursor:pointer; }
.import-rules-list { margin:12px 0 0; padding-left:20px; color:#74816b; font-size:.8125rem; line-height:1.85; }
.import-rules-list li+li { margin-top:8px; }
.import-rules-list strong { color:#4b6242; font-weight:650; }
.help-note .help-conflicts-heading { margin-top:20px; }

/* History-only selection modes reuse the photo picker without changing other selectors. */
.filters>.history-target-trigger { min-height:54px; max-width:340px; }
.history-target-trigger>.icon:first-child { margin-left:0; width:21px; height:21px; flex-shrink:0; }
.history-target-trigger .individual-select-copy small { white-space:normal; overflow-wrap:anywhere; line-height:1.5; }
.history-picker-tabs {
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px;
  margin-bottom:13px; padding:4px; border:1px solid #3d5940;
  border-radius:10px; background:#10251b;
}
.history-picker-tabs>button {
  min-width:0; min-height:44px; padding:8px 10px; border:1px solid transparent;
  border-radius:7px; background:transparent; color:#bad0ad;
  font:inherit; font-size:.875rem; line-height:1.5; font-weight:650;
  text-align:center; white-space:normal;
}
.history-picker-tabs>button:hover { color:#e8f3df; background:#294632; }
.history-picker-tabs>button[aria-selected="true"] { color:#203820; background:#c5e995; border-color:#c5e995; }
.history-picker-tabs>button:focus-visible { outline:2px solid #ecffd4; outline-offset:2px; }
.history-picker-description { margin:0 0 11px; color:#bfd3b3; font-size:.875rem; line-height:1.75; }
.picker-results.history-group-results { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.history-group-choice {
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  min-width:0; min-height:86px; padding:15px; border:1px solid #3d5740;
  border-radius:11px; background:#1b3225; color:#e5efdf; text-align:left;
}
.history-group-choice:hover { background:#28462e; border-color:#9dc27c; }
.history-group-choice:focus-visible { outline:3px solid #c7ed9a; outline-offset:2px; }
.history-group-choice.selected { border-color:#c5e995; box-shadow:inset 0 0 0 1px #c5e995; background:#2b462c; }
.history-group-copy { flex:1; min-width:0; }
.history-group-copy>strong { display:block; color:#edf5e8; font-size:1rem; line-height:1.55; overflow-wrap:anywhere; }
.history-group-copy>small { display:block; margin-top:5px; color:#c9e9ad; font-size:.8125rem; line-height:1.5; }
.history-group-count { flex-shrink:0; min-width:46px; text-align:right; font-variant-numeric:tabular-nums; }
.history-group-count>b { display:block; color:#d5efb7; font-size:1.35rem; line-height:1.3; }
.history-group-count>small { display:block; margin-top:3px; color:#b7cda9; font-size:.8125rem; }
.picker-footer>.history-picker-clear { border-color:#779a59; color:#e6f6d8; background:#34532f; }
@media (max-width:760px) {
  .filters>.history-target-trigger { max-width:none; }
  .history-picker-tabs { gap:4px; }
  .history-picker-tabs>button { padding:8px 5px; }
  .picker-results.history-group-results { grid-template-columns:minmax(0,1fr); }
  .history-group-choice { min-height:78px; padding:13px; }
}
/* End history-only selection modes. */

  display:block;
  flex:0 0 58px;
  width:58px;
  height:58px;
  aspect-ratio:1;
  border-radius:13px;
  background:var(--beatmate-logo) center / contain no-repeat;
  background-color:#cedbc5;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.sidebar .brand-name {
  color:#f1f5ed;
  font-size:1rem;
  font-weight:850;
  line-height:1.25;
  letter-spacing:.015em;
  white-space:nowrap;
}
.sidebar .brand-sub {
  color:#b7ccac;
  font-size:.75rem;
  font-weight:650;
  line-height:1.5;
  letter-spacing:.025em;
  margin-top:4px;
  white-space:nowrap;
}
.mobile-brand { min-width:0; flex-shrink:0; }
.mobile-brand-copy {
  display:flex;
  flex-direction:column;
  min-width:0;
  line-height:1.25;
}
.mobile-brand-copy>b {
  display:block;
  color:#305436;
  font-size:.9375rem;
  font-weight:800;
  line-height:1.25;
  letter-spacing:0;
  white-space:nowrap;
}
.mobile-brand-copy>small {
  display:block;
  margin-top:2px;
  color:#6c8060;
  font-size:.75rem;
  line-height:1.4;
  letter-spacing:0;
  white-space:nowrap;
}

@media (max-width:1250px) and (min-width:1051px) {
  .sidebar .brand { gap:9px; }
  .sidebar .brand-mark { flex-basis:50px; width:50px; height:50px; border-radius:11px; }
}
@media (max-width:1050px) and (min-width:761px) {
  .sidebar .brand { gap:8px; }
  .sidebar .brand-mark { flex-basis:44px; width:44px; height:44px; border-radius:10px; }
}
@media (max-width:760px) {
  .mobile-brand { gap:8px; }
  .mobile-brand .brand-mark { flex-basis:44px; width:44px; height:44px; border-radius:10px; }
}
@media (max-width:380px) {
  .mobile-brand { gap:6px; }
  .mobile-brand .brand-mark { flex-basis:38px; width:38px; height:38px; border-radius:9px; }
  .mobile-brand-copy>b { font-size:.875rem; }
}
/* At 320–369px the logo already contains ビートメイト. Keep its adjacent copy
   accessible without competing with the unchanged help and backup controls. */
@media (max-width:369px) {
  .mobile-brand { gap:0; }
  .mobile-brand .brand-mark { flex-basis:40px; width:40px; height:40px; border-radius:9px; }
  .mobile-brand-copy {
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
}

/* A meaningful startup screen even when scripts are disabled by a file preview. */
.boot-card{width:min(430px,calc(100% - 32px));box-sizing:border-box;background:#fff;border:1px solid #dce5d3;border-radius:20px;padding:28px 23px;text-align:center;color:var(--ink,#20372b);box-shadow:0 8px 30px #20372b0b;display:flex;flex-direction:column;align-items:center;gap:14px}
.boot-card .boot-brand{display:block;width:80px;height:80px;flex:none}
.boot-card h1{font-size:1.25rem;line-height:1.5;margin:0;letter-spacing:0}
.loading-screen .boot-card p{margin:0;line-height:1.75;font-size:.875rem;color:#647260}
.loading-screen .boot-card #boot-status{font-weight:700;color:#31543d;font-size:1rem}
.boot-card #boot-retry[hidden]{display:none}
.boot-card #boot-retry{margin-top:4px}

/* Compact individual-profile opponent summaries. */
.opponent-list { gap:6px; }
.opponent-list .opponent-row {
  display:grid; grid-template-columns:minmax(0,1fr) auto auto;
  align-items:center; gap:6px 10px; padding:8px 10px;
}
.opponent-list .opponent-row .person { min-width:0; }
.opponent-list .opponent-row .person>span { min-width:0; }
.opponent-list .opponent-row .person-name { overflow-wrap:anywhere; }
.opponent-list .opponent-row .btn { padding:4px 8px; min-height:36px; }
@media(max-width:760px) {
  .opponent-list .opponent-row { grid-template-columns:minmax(0,1fr) auto; gap:0 8px; padding:7px 9px; }
  .opponent-list .opponent-row .person { grid-row:1 / 3; align-self:center; align-items:center; }
  .opponent-list .opponent-result { grid-column:2; text-align:right; }
  .opponent-list .opponent-row .btn { grid-column:2; justify-self:end; min-height:32px; padding:2px 8px; }
}

/* Startup guard: never leave a permanent loading spinner. ES5 syntax for older viewers. */
(function () {
  var timer;
  var finished = false;
  function set(id, value) { var element = document.getElementById(id); if (element) element.textContent = value; }
  function fail(error) {
    if (finished) return;
    clearTimeout(timer);
    if (!document.getElementById('boot-status')) return;
    document.getElementById('app').className = 'loading-screen';
    set('boot-status','アプリを起動できませんでした。');
    set('boot-help','公開先のURLをSafari・Chromeなどで開き、再読み込みしてください。ファイルのプレビューでは機能が制限される場合があります。');
    set('boot-extra','保存済みデータがある場合、ブラウザのデータを削除せずに再読み込みしてください。');
    var retry = document.getElementById('boot-retry');
    if (retry) { retry.hidden = false; retry.onclick = function () { window.location.reload(); }; }
    if (error && window.console) console.error('BeatMate startup:', error);
  }
  window.BeatmateBoot = {
    start: function () {
      set('boot-status','保存データを確認しています…');
      set('boot-help','個体情報と戦績を準備しています。未登録でもそのまま起動できます。');
      set('boot-extra','');
    },
    done: function () { finished = true; clearTimeout(timer); },
    fail: fail
  };
  window.addEventListener('error',function (event) { if (document.getElementById('boot-status')) fail(event.error || event.message); });
  window.addEventListener('unhandledrejection',function (event) { if (document.getElementById('boot-status')) fail(event.reason); });
  timer = setTimeout(function () { fail(new Error('Startup timeout')); },18000);
})();
</script>
  <script>/* BeatMate Battle Checker: JSON compatibility, immutable data operations and summaries. */

  const SCHEMA_VERSION = 2;

  const STATUSES = ['現役', '引退', '休養中', '旅立ち'];
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const fail = message => { throw new Error(message); };

      schema: SCHEMA, schemaVersion: SCHEMA_VERSION, trainerName: '', records: [], matches: [],
      source: { fileName: '', exportedAt: null, importedAt: null }, updatedAt: 0
    };

  function text(value, label, limit, fallback) {
    if (value === undefined || value === null) return fallback === undefined ? '' : fallback;
    if (typeof value !== 'string') fail(label + 'は文字列で指定してください。');
    if (value.length > limit) fail(label + 'が長すぎます（最大' + limit + '文字）。');
    return value;
  }

  function id(value, label) {
    if (typeof value !== 'string' || !value.trim() || value.length > 200 || /[\u0000-\u001f\u007f]/.test(value)) {

  }

    if (!Number.isSafeInteger(result) || result < 0 || result > 8640000000000000) fail(label + 'が不正です。');

  }

  function iso(value, label) {

  function numeric(value, label, minimum, maximum, decimals, nullValue) {
    if (value === undefined || value === null || value === '') return nullValue === undefined ? null : nullValue;
    const number = typeof value === 'number' || typeof value === 'string' ? Number(value) : NaN;
    if (!Number.isFinite(number) || number < minimum || number > maximum) fail(label + 'の数値が範囲外です。');

  function normalizeRecord(record, index) {
    const label = '個体' + (index + 1) + 'の';
    if (!isObject(record)) fail('個体' + (index + 1) + 'のデータ形式が不正です。');
    if (record.external === true) fail('外部個体は、戦績バックアップのexternalRecordsに分けて保存してください。');
    const species = text(record.species, label + '種類', 100).trim();
    if (!species) fail(label + '種類が空欄です。');
    const status = record.status === undefined || record.status === null || record.status === '' ? '現役' : record.status;
    if (!STATUSES.includes(status)) fail(label + '状態が不正です。');

    if (photo === undefined || photo === null || photo === '') photo = null;

    if (!Array.isArray(ratings) || ratings.length !== 3) fail(label + '能力値は3項目で指定してください。');

      id: id(record.id, label + 'ID'), species,
      name: text(record.name, label + '名前', 100).trim(),

      weight: numeric(record.weight, label + '体重', 0, 999.99, 2),

      fail(label + 'IDが不正です。外部個体専用のIDを使用してください。');
    }

    if (!name) fail(label + '名前が空欄です。');

    const recordIds = new Set(records.map(record => record.id));

      fileName: text(fileName, 'ファイル名', 1024, parsed.source && parsed.source.fileName || ''),
      exportedAt: parsed.exportedAt || parsed.source && parsed.source.exportedAt || null,
      importedAt: new Date(time).toISOString()

      state: {
        schema: SCHEMA, schemaVersion: SCHEMA_VERSION,
        trainerName: parsed.trainerName || state.trainerName || '',

  function renderBreakdownPanel(){

ton class="btn primary" data-action="profile" data-id="${esc(individualId)}">この個体の全戦績</button></div>`,'wide-dialog');

  function renderMatchupTable(focal,opponents){

  function renderPairPanel(){const a=recordMap.get(ui.pairA),b=recordMap.get(ui.pairB),matches=pairMatches(ui.pairA,ui.pairB);const wa=matches.filter(m=>m.winnerId===ui.pairA).length;return `<section class="panel pair-panel"><div class="pair-header"><h2>2個体を比べる</h2><span class="badge neutral">直接対決</span></div><div class="pair-grid"><div class="pair-contender"><div class="field">${individualSelect('pair-a',ui.pairA,'個体Aを選択',true)}<small>${a?esc(fullSize(a)):'個体を選択してください'}</small></div></div><div class="pair-score"><div class="pair-numbers">${wa}<span class="divider">:</span>${matches.length-wa}</div><div class="pair-meta">${matches.length?`${matches.length}試合の勝数`:'まだ未対戦'}</div></div><div class="pair-contender"><div class="field">${individualSelect('pair-b',ui.pairB,'個体Bを選択',true)}<small>${b?esc(fullSize(b)):'個体を選択してください'}</small></div></div></div><div class="pair-detail"><button class="btn small" data-action="pair" data-a="${esc(ui.pairA)}" data-b="${esc(ui.pairB)}" ${!a||!b?'disabled':''}>対戦履歴を見る</button><button class="btn ghost small" data-action="new-pair-match" data-a="${esc(ui.pairA)}" data-b="${esc(ui.pairB)}" ${!a||!b?'disabled':''}>${icon('plus')}この組み合わせで記録</button></div></section>`;}
  function renderIndividuals(){

laceholder="例：7.5"></div><div class="field external-full-width"><label for="external-notes">メモ <span>（任意）</span></label><textarea id="external-notes" class="control" rows="2" maxlength="3000" placeholder="特徴や対戦時の情報など">${esc(r?.notes||'')}</textarea></div></div><p class="external-form-hint">外部個体は元アプリには追加されません。<br>別端末へ引き継ぐときは「戦績バックアップ」を使えます。</p><p id="external-record-error" class="form-error" role="alert"></p></div><div class="picker-footer"><button class="btn" type="button" data-action="back-external-record">${r?'キャンセル':'個体選択へ戻る'}</button><button id="save-external-record" class="btn primary" type="submit">${r?'変更を保存':'追加して選択'}</button></div></form>`;

  async function submitExternalRecord(event){
    event.preventDefault();if(busy||externalSaving||!picker)return;
    const session=picker,form=event.target;if(!form.reportValidity())return;
    $('external-record-error').textContent='';
    let record;
    try{record=C.makeExternalRecord(state,{name:$('external-name').value,species:$('external-species').value,trainerName:$('external-trainer').value,size:$('external-size').value,weight:$('external-weight').value,notes:$('external-notes').value},session.editingId||undefined);}
    catch(error){$('external-record-error').textContent=error.message;return;}
    externalSaving=true;$('individual-picker').querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=true);
    try{
      if(!await commit(C.upsertExternalRecord(state,record))){if(picker===session&&$('external-record-error'))$('external-record-error').textContent=saveError||'保存できませんでした。入力内容を確認してもう一度お試しください。';return;}

      if(picker===session){
        if(session.target==='external-edit'){closePicker(false);render();showProfile(record.id);}
        else{chooseIndividual(record.id);render();}

  }

  function showMatch(existingId=null,winnerId='',loserId=''){

  function exportFile(type){
    ui.menu=false;render();const name=safeFilename(),date=today();
    if(type==='backup'){download(`${name}_${date}_戦績チェッカー_バックアップ.json`,JSON.stringify(C.exportBackup(state),null,2),'application/json;charset=utf-8');toast('個体情報・外部個体・戦績を含む、戦績チェッカーのバックアップを出力しました。');}
    if(type==='csv'){const matches=filterMatches();download(`${name}_${date}_戦績一覧.csv`,C.csv(state,matches),'text/csv;charset=utf-8');toast(`${matches.length}試合をCSVで書き出しました。`);}
    if(type==='individuals'){download(`${name}_${date}_個体情報.json`,JSON.stringify(C.exportIndividuals(state),null,2),'application/json;charset=utf-8');toast('元アプリ用の個体JSONを書き出しました。外部個体と戦績は含まれません。');}
    if(type==='html'){
      const portableSnapshotId='portable-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
      const seed=JSON.stringify({...C.exportBackup(state),portableSnapshotId}).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
      const html=pristineHtml.replace(/(<script id="initial-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_,open,close)=>open+seed+close);
      download('beatmate_battle_checker_v2.html',html,'text/html;charset=utf-8');toast('現在の個体・戦績を含むオフライン版を書き出しました。');
    }
  }
  function toast(message,buttonText='',action=''){$('toast').innerHTML=`<span>${esc(message)}</span>${buttonText?`<button data-action="${action}">${esc(buttonText)}</button>`:''}`;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),buttonText?12000:6000);}
  function hydrate(saved){const parsed=C.parseImport(saved);if(parsed.kind!=='backup')throw new Error('保存データの形式が不正です。');return {schema:'beatmate-battle-checker',schemaVersion:parsed.schemaVersion,trainerName:parsed.trainerName,records:parsed.records,matches:parsed.matches,source:parsed.source,updatedAt:parsed.updatedAt};}
  async function commit(next,{recover=false}={}){
    if(busy)return false;if(storageReadFailed&&!recover){toast('保存データを読み取れません。復旧前のデータを保存し、正常な戦績バックアップを読み込んで復元してください。');return false;}
    busy=true;document.querySelectorAll('#save-match,#confirm-import,[data-action="confirm-delete"]').forEach(el=>el.disabled=true);
    try{const receipt=await repo.write(C.exportBackup(next),revision);revision=receipt.revision;saveError='';unsaved=false;storageReadFailed=false;failedStoredState=null;externalChange=false;state=next;rebuild();channel?.postMessage({revision});return true;}
    catch(error){
      if(error.code==='CONFLICT'){externalChange=true;saveError='別のタブで更新されたため、保存を止めました。「最新を読み込む」で確認し、もう一度記録してください。';toast('別のタブの更新があります。最新データを読み込んでください。');render();return false;}
      state=next;rebuild();unsaved=true;saveError='自動保存できません。この画面を閉じる前に「戦績バックアップ」を保存してください。';return true;
    }finally{busy=false;document.querySelectorAll('#save-match,#confirm-import,[data-action="confirm-delete"]').forEach(el=>el.disabled=false);updateMatchPreview();}
  }
  async function reloadState(discardUnsaved=false){
    if(busy)return;
    if(unsaved&&!discardUnsaved){openDialog(`${dialogHeader('未保存の記録があります','最新データに切り替える前に、現在の内容を保存できます。')}<div class="dialog-body"><p style="font-size:.875rem;line-height:1.9">この画面には、自動保存できなかった記録があります。「現在のバックアップ」を保存してください。「未保存を破棄して読込」を押すと、この画面だけにある変更は失われます。</p><button class="btn full" style="margin-top:18px" data-action="export-backup">${icon('download')}現在のバックアップを保存</button></div><div class="dialog-footer"><button class="btn" data-action="close-dialog">戻る</button><button class="btn danger" data-action="reload-state-discard">未保存を破棄して読込</button></div>`,'compact-dialog');return;}
    try{const snapshot=await repo.read();if(snapshot){const next=hydrate(snapshot.state);state=next;revision=snapshot.revision;rebuild();externalChange=false;saveError='';unsaved=false;storageReadFailed=false;render();closeDialog();toast('最新の保存データを読み込みました。');}}catch(error){toast('最新データを読み取れませんでした。現在のデータをバックアップしてください。');}
  }
  function resetFilters(){Object.assign(ui,{search:'',individual:'',historyMode:'all',historySpecies:'',historyStatus:'',method:'',result:'all',period:'all',page:1});render();}
  async function handleAction(button){
    if(externalSaving)return;
    const a=button.dataset.action,id=button.dataset.id;
    if(a==='view'){ui.menu=false;ui.view=button.dataset.view;location.hash=ui.view;render();window.scrollTo({top:0,behavior:'instant'});}
    else if(a==='new-match')showMatch(null,button.dataset.winner||'');
    else if(a==='edit-match')showMatch(id);
    else if(a==='delete-match')showDelete(id);
    else if(a==='confirm-delete')await deleteConfirmed(id);
    else if(a==='new-pair-match')showMatch(null,button.dataset.a,button.dataset.b);
    else if(a==='open-picker')openPicker(button.dataset.picker);
    else if(a==='close-picker')closePicker();
    else if(a==='new-external-record')showExternalForm();
    else if(a==='edit-external-record')editExternalRecord(id);
    else if(a==='back-external-record')returnFromExternalForm();
    else if(a==='choose-individual')chooseIndividual(id);
    else if(a==='history-picker-tab')setHistoryPickerTab(button.dataset.mode);
    else if(a==='choose-history-target')chooseHistoryTarget(button.dataset.mode,button.dataset.value);
    else if(a==='clear-history-target')chooseHistoryTarget('all');
    else if(a==='reset-picker')resetPicker();
    else if(a==='picker-more'&&picker){picker.limit+=40;renderPickerResults();}
    else if(a==='match-detail')showMatchDetail(id,button.dataset.fromMethod==='true');
    else if(a==='method-detail')showMethodDetail(id,button.dataset.outcome,Number(button.dataset.method),button.dataset.scope);
    else if(a==='method-opponent'&&methodDetail){methodDetail.opponentId=id;methodDetail.limit=50;renderMethodDetail();}
    else if(a==='method-more'&&methodDetail){methodDetail.limit+=50;renderMethodDetail();}
    else if(a==='return-method')renderMethodDetail();
    else if(a==='close-dialog')closeDialog();
    else if(a==='profile')showProfile(id);
    else if(a==='pair')showPair(button.dataset.a,button.dataset.b);
    else if(a==='swap-contenders'){const w=$('match-winner').value;$('match-winner').value=$('match-loser').value;$('match-loser').value=w;updateMatchPreview();}
    else if(a==='menu'){ui.menu=!ui.menu;render();$('export-menu-button')?.focus({preventScroll:true});}
    else if(a==='help')showHelp();
    else if(a==='import'||a==='import-individuals'||a==='import-backup'){ui.menu=false;render();showImport(a==='import-backup'?'backup':'individuals');}
    else if(a==='choose-file'){$('import-file').value='';$('import-file').click();}
    else if(a==='confirm-import')await applyImport();
    else if(a==='reset-filters')resetFilters();
    else if(a==='reset-matrix-filters'){ui.matrixSpecies='';ui.matrixStatus='';render();$('matrix-row-trigger')?.focus({preventScroll:true});}
    else if(a==='reset-roster-filters'){ui.rosterSearch='';ui.rosterSpecies='';ui.rosterStatus='';render();$('roster-search')?.focus({preventScroll:true});}
    else if(a==='toggle-history-order'){ui.historyOrder=ui.historyOrder==='oldest'?'newest':'oldest';ui.page=1;render();$('history-order-button')?.focus({preventScroll:true});}
    else if(a==='toggle-profile-history-order')toggleProfileHistoryOrder(button);
    else if(a==='prev-page'){ui.page--;render();}
    else if(a==='next-page'){ui.page++;render();}
    else if(a==='reload-state')await reloadState();
    else if(a==='reload-state-discard')await reloadState(true);
    else if(a==='undo-delete'&&deletedMatch){const m=deletedMatch;if(await commit(C.upsertMatch(state,{...m,updatedAt:Date.now()}))){deletedMatch=null;render();toast('削除した対戦を元に戻しました。');}}
    else if(a==='export-recovery'){download('beatmate_recovery.json',JSON.stringify(failedStoredState,null,2),'application/json;charset=utf-8');toast('読み取りエラーのあった保存内容を書き出しました。');}
    else if(a.startsWith('export-'))exportFile(a.slice(7));
  }
  function bind(){
    document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled){if(button.dataset.action==='toggle-profile-history-order'){event.preventDefault();event.stopPropagation();}handleAction(button).catch(error=>toast('操作できませんでした。'+error.message));return;}if(ui.menu&&!event.target.closest('.menu-container')){ui.menu=false;render(true);}});
    document.addEventListener('submit',event=>{if(event.target.id==='match-form')submitMatch(event);else if(event.target.id==='external-record-form')submitExternalRecord(event);});
    document.addEventListener('input',event=>{
      if(event.isComposing)return;
      if(event.target.id==='history-search'){ui.search=event.target.value;ui.page=1;render(true);}
      else if(event.target.id==='roster-search'){ui.rosterSearch=event.target.value;render(true);}
      else if(event.target.id==='picker-search'&&picker){picker.query=event.target.value;picker.limit=40;renderPickerResults();}
      else if(event.target.id==='external-trainer')updateExternalPhotoPreview();
      else if(event.target.closest('#match-form'))updateMatchPreview();
    });
    document.addEventListener('compositionend',event=>{if(event.target.id==='history-search'){ui.search=event.target.value;ui.page=1;render(true);}else if(event.target.id==='roster-search'){ui.rosterSearch=event.target.value;render(true);}else if(event.target.id==='picker-search'&&picker){picker.query=event.target.value;picker.limit=40;renderPickerResults();}else if(event.target.id==='external-trainer')updateExternalPhotoPreview();});
    document.addEventListener('change',event=>{
      const id=event.target.id,v=event.target.value;let rerender=true;
      // Close the native selection UI before updating any results; never refocus it.
      if(event.target.tagName==='SELECT')event.target.blur();
      if(['picker-species','picker-status','picker-sort'].includes(id)&&picker){picker[id.slice(7)]=v;picker.limit=40;renderPickerResults();rerender=false;}
      else if(id==='filter-method'){ui.method=v;ui.page=1;}
      else if(id==='filter-result'){ui.result=hasHistoryTarget()&&['win','loss'].includes(v)?v:'all';ui.page=1;}
      else if(id==='filter-period'){ui.period=v;ui.page=1;}
      else if(id==='roster-status')ui.rosterStatus=v;
      else if(id==='roster-species')ui.rosterSpecies=v;
      else if(id==='roster-sort')ui.rosterSort=v;
      else if(id==='matrix-species')ui.matrixSpecies=v;
      else if(id==='matrix-status')ui.matrixStatus=v;
      else if(id==='matrix-sort')ui.matrixSort=v;
      else if(id==='import-file'){inspectFile(event.target.files?.[0]);rerender=false;}
      else if(event.target.closest('#match-form')){updateMatchPreview();rerender=false;}
      else rerender=false;if(rerender&&!refreshSelectResults(id))render(false);
    });
    document.addEventListener('dragover',event=>{if(event.target.closest('#drop-zone')){event.preventDefault();$('drop-zone').classList.add('dragover');}});
    document.addEventListener('dragleave',event=>{if(event.target.closest('#drop-zone'))$('drop-zone')?.classList.remove('dragover');});
    document.addEventListener('drop',event=>{if(event.target.closest('#drop-zone')){event.preventDefault();$('drop-zone').classList.remove('dragover');inspectFile(event.dataTransfer.files?.[0]);}});
    document.addEventListener('keydown',event=>{
      if(picker?.target==='filter-individual'&&event.target.dataset?.action==='history-picker-tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
        event.preventDefault();const modes=['individual','species','status'],current=modes.indexOf(picker.historyTab);
        setHistoryPickerTab(event.key==='Home'?modes[0]:event.key==='End'?modes[2]:modes[(current+(event.key==='ArrowRight'?1:2))%3]);return;
      }
      if(event.key==='Escape'&&ui.menu){ui.menu=false;render();}
    });
    window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['records','matrix','individuals'].includes(v)&&v!==ui.view){ui.view=v;render();}});
    window.addEventListener('beforeunload',event=>{if(unsaved){event.preventDefault();event.returnValue='';}});
  }
  async function init(){
    pristineHtml='<!doctype html>\n'+document.documentElement.outerHTML;bind();window.BeatmateBoot.start();
    let seed,rawSeed,storageNamespace='';
    try{rawSeed=JSON.parse($('initial-data').textContent);seed=hydrate(rawSeed);storageNamespace=typeof rawSeed.portableSnapshotId==='string'&&/^[a-z0-9-]{1,100}$/.test(rawSeed.portableSnapshotId)?rawSeed.portableSnapshotId:'';}catch(error){window.BeatmateBoot.fail(error);return;}
    state=seed;
    try{
      repo=await window.BattleStore.open(storageNamespace);let snapshot;
      try{snapshot=await repo.read();}catch(error){storageReadFailed=true;saveError='このブラウザの保存データを読み取れません。上書きせず停止しています。アプリを開き直してください。';}
      if(snapshot){failedStoredState=snapshot.state;revision=snapshot.revision;try{state=hydrate(snapshot.state);failedStoredState=null;}catch(error){storageReadFailed=true;saveError='保存データの形式を読み取れません。上書きを停止しました。バックアップを保存し、内容を確認してください。';}}
      else if(!storageReadFailed){try{const receipt=await repo.write(C.exportBackup(state),null);revision=receipt.revision;}catch(error){if(error.code==='CONFLICT'){const current=await repo.read();state=hydrate(current.state);revision=current.revision;}else{unsaved=true;saveError='保存領域にアクセスできません。以前の戦績が表示されない場合は、ブラウザを開き直すか戦績バックアップを読み込んでください。この画面での変更は、閉じる前にバックアップしてください。';}}}
    }catch(error){unsaved=true;saveError='自動保存を開始できませんでした。記録後はバックアップを保存してください。';repo={read:async()=>null,write:async()=>{throw new Error('保存不可');},kind:'memory'};}
    rebuild();render();window.BeatmateBoot.done();
    try{if('BroadcastChannel'in window){channel=new BroadcastChannel('beatmate-battle-checker'+(storageNamespace?':'+storageNamespace:''));channel.onmessage=event=>{if(event.data?.revision&&event.data.revision!==revision){externalChange=true;render(true);}};}}catch(error){console.warn('BeatMate tab sync unavailable:',error);}
  }
  function startApp(){init().catch(error=>window.BeatmateBoot.fail(error));}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startApp,{once:true});else startApp();
})();
</script>
